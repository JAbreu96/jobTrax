<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Tracker — Kanban</title>
<link rel="stylesheet" href="{{ url_for('static', filename='job_views.css') }}">
<style>
  /* Only what the board adds to the shared tokens in job_views.css. */
  :root { --col-bg: #eeeef1; }
  @media (prefers-color-scheme: dark) {
    :root { --col-bg: #1b1b20; }
  }
  input[type="search"], input[type="date"] {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
  }
  main {
    padding: 20px 28px 40px;
    overflow-x: auto;
  }
  .board {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    min-height: 60vh;
  }
  .column {
    background: var(--col-bg);
    border-radius: 10px;
    width: 260px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 180px);
  }
  .column-header {
    padding: 12px 14px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
  }
  .column-count {
    background: var(--card);
    color: var(--muted);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 600;
  }
  .column-body {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 40px;
  }
  .column-body.drag-over { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 8px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    cursor: grab;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  /* No description saved on this job -- the same amber badge the table uses.
     Shaped like .recruiter-pill above so the two read as the same kind of
     annotation; amber rather than accent because it is a gap, not a fact
     about the job. */
  .incomplete-pill {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    background: var(--card);
    border: 1px solid #d9a441;
    color: #d9a441;
    border-radius: 999px;
    padding: 1px 8px;
    margin-top: 2px;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .card .company {
    font-weight: 600;
    color: var(--text);
    display: block;
    margin-bottom: 2px;
    text-decoration: none;
  }
  .card .company:hover { color: var(--accent); }
  .card .title { color: var(--muted); font-size: 12px; display: block; margin-bottom: 4px; }
  .card .meta { color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 6px; }
  .empty-col { color: var(--muted); font-size: 12px; padding: 10px 4px; text-align: center; }
  .modal-head h2 { font-size: 16px; margin: 0 0 2px; }
  .company-row { display: flex; align-items: center; gap: 6px; }
  .company-editable {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    cursor: text;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .company-editable:focus { outline: 2px solid var(--accent); }
  a.company-link-icon { color: var(--accent); text-decoration: none; font-size: 14px; }
  .modal-subtitle { color: var(--muted); font-size: 12px; }
  .delete-job-btn {
    background: none;
    border: 1px solid #d9534f;
    color: #d9534f;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .modal-field .editable, .modal-field select {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    min-height: 16px;
  }
  .modal-field .editable[data-field="notes"], .modal-field .editable[data-field="job_summary"] {
    white-space: pre-wrap;
    min-height: 90px;
    max-height: 260px;
    overflow-y: auto;
  }
  .modal-field .editable:focus, .modal-field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  @keyframes flash { from { background: #d9f5df; } to { background: var(--bg); } }
  .modal-field .editable.markdown-rendered:not(.expanded) {
    max-height: 4.2em;
    overflow: hidden;
    position: relative;
  }
  .modal-field .editable.markdown-rendered:not(.expanded)::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 1.4em;
    background: linear-gradient(to bottom, transparent, var(--bg));
  }
  textarea.markdown-raw {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
  }
  .modal-field input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    width: 100%;
  }
  .non-date-value {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--bg);
    font-size: 13px;
  }
  .non-date-value button:hover { background: var(--card); }
  /* Kept here rather than in job_views.css, though the table writes it
     identically: it ties on specificity with .modal-field select above, and
     the board needs the later rule to win, which a shared sheet loaded first
     would flip. */
  .interview-form input, .interview-form select {
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); color: var(--text); font-size: 13px;
  }
  /* Recruiter, matching the table view's vocabulary. */
  .recruiter-pill {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    padding: 1px 8px;
    margin-top: 2px;
    font-size: 10px;
    font-weight: 600;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .recruiter-select { min-width: 240px; }
  .followup-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 6px 3px 10px;
    font-size: 12px;
  }
  .followup-chip button:hover { background: var(--card); color: var(--text); }
  .followup-add input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
  }
  .followup-add button:hover { background: var(--card); }
  .modal-field input[type="text"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>Job Tracker</h1>
  <nav class="view-nav">
    <a href="/">Table</a>
    <a href="/kanban" class="active">Kanban</a>
    <a href="/insights">Insights</a>
  </nav>
  <div class="stats" id="stats"></div>
  <div class="goal-badge" id="goalBadge"></div>
</header>
<div class="controls">
  <input type="search" id="search" placeholder="Search company, title, notes…">
  <div class="date-filter">
    <input type="date" id="dateFrom" title="Added from">
    <span>–</span>
    <input type="date" id="dateTo" title="Added to">
    <button class="linklike" id="filterToday">Today</button>
    <button class="linklike" id="filterWeek">This Week</button>
    <button class="linklike" id="filterClearDates">Clear</button>
  </div>
  <button class="linklike" id="exportCsvBtn">Export CSV</button>
  <button class="primary" id="addJobBtn">+ Add Job</button>
</div>
<main>
  <div class="board" id="board"></div>
</main>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal-panel" id="modalPanel"></div>
</div>

<script src="{{ url_for('static', filename='job_fields.js') }}"></script>
<script>
const STATUS_VALUES = {{ status_values | tojson }};
const INTERVIEW_TYPES = {{ interview_types|tojson }};
// Blank status becomes its own "Not Tracked" column, placed first.
const COLUMNS = ["", ...STATUS_VALUES.filter(s => s !== "")];
const COLUMN_LABELS = { "": "Not Tracked" };

let allJobs = [];

// Shared with the table view -- see static/job_fields.js. These used to be a
// second copy named buildModal*, which is how the board ended up without an
// interviews field the table has had all along.
const {
  rowKey, localISODate, startOfWeekISO, isValidISODate,
  parseFollowupLog, serializeFollowupLog,
  renderMarkdownInto, appendInlineMarkdown,
  checkMarkdownOverflow, refreshMarkdownFields, saveField, jobKeyFields,
} = JobFields;

const {
  makeDateField, renderDateInput, makeFollowupField, renderFollowupField,
  makeDetailField, makeMarkdownField, makeRecruiterField, makeInterviewsField,
  makeDeleteField,
} = JobFields.create({
  fieldClass: 'modal-field',
  notesClass: '',
  // No ancestor click handler to defend against: the modal is not a table row.
  stopClicks: false,
  tagFields: true,
  // A date edit can change which column a card belongs in, so redraw the board.
  afterSave: () => render(),
  interviewTypes: INTERVIEW_TYPES,
  onDeleted: (job) => {
    allJobs = allJobs.filter(j => rowKey(j) !== rowKey(job));
    closeModal();
    render();
  },
});

async function loadJobs() {
  // No include_archived here, unlike the table, and that is the answer rather
  // than an omission. The table passes it only when arriving from an Insights
  // funnel tile, so that the rows it shows match the count just clicked. Every
  // one of those tiles links to `/?stage=...` — the table. Nothing links into
  // the board with a query string, so there is no drill-through for it to
  // match, and the board stays what it looks like: the working set.
  const res = await fetch('/api/jobs');
  allJobs = await res.json();
  render();
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;
  const filtered = allJobs.filter(j => {
    if (dateFrom && (j.date_added || '') < dateFrom) return false;
    if (dateTo && (j.date_added || '') > dateTo) return false;
    if (!q) return true;
    const haystack = [j.company, j.position_title, j.notes, j.location].join(' ').toLowerCase();
    return haystack.includes(q);
  });

  document.getElementById('stats').textContent = `${filtered.length} of ${allJobs.length} jobs`;

  const DAILY_GOAL = 5;
  const todayStr = localISODate(new Date());
  const appliedToday = allJobs.filter(j => j.status === 'Applied' && (j.date_applied || '') === todayStr).length;
  const goalBadge = document.getElementById('goalBadge');
  goalBadge.textContent = `Applied today: ${appliedToday} / ${DAILY_GOAL}`;
  goalBadge.classList.toggle('goal-met', appliedToday >= DAILY_GOAL);

  const board = document.getElementById('board');
  board.innerHTML = '';

  for (const status of COLUMNS) {
    const jobsInColumn = filtered.filter(j => (j.status || '') === status);

    const column = document.createElement('div');
    column.className = 'column';
    column.dataset.status = status;

    const headerEl = document.createElement('div');
    headerEl.className = 'column-header';
    const label = document.createElement('span');
    label.textContent = COLUMN_LABELS[status] || status;
    const count = document.createElement('span');
    count.className = 'column-count';
    count.textContent = jobsInColumn.length;
    headerEl.appendChild(label);
    headerEl.appendChild(count);
    column.appendChild(headerEl);

    const body = document.createElement('div');
    body.className = 'column-body';
    body.dataset.status = status;

    if (jobsInColumn.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-col';
      empty.textContent = 'No jobs';
      body.appendChild(empty);
    }

    for (const job of jobsInColumn) {
      body.appendChild(makeCard(job));
    }

    addDropHandlers(body);
    column.appendChild(body);
    board.appendChild(column);
  }
}

function makeCard(job) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.key = rowKey(job);

  const company = document.createElement(job.link ? 'a' : 'span');
  company.className = 'company';
  company.textContent = job.company;
  if (job.link) {
    company.href = job.link;
    company.target = '_blank';
    company.rel = 'noopener noreferrer';
  }
  card.appendChild(company);

  const title = document.createElement('span');
  title.className = 'title';
  title.textContent = job.position_title || '';
  card.appendChild(title);

  const pill = JobFields.recruiterBadge(job);
  if (pill) card.appendChild(pill);

  // missing_description rides down with the job on /api/jobs -- computed in
  // SQL, because job_summary itself is not in the list payload and there is
  // nothing here to test for emptiness. An absent flag means "no warning",
  // never "no description".
  if (job.missing_description) {
    const incomplete = document.createElement('span');
    incomplete.className = 'incomplete-pill';
    incomplete.textContent = 'Incomplete';
    incomplete.title = 'No job description saved';
    card.appendChild(incomplete);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  const loc = document.createElement('span');
  loc.textContent = job.location || '';
  const date = document.createElement('span');
  date.textContent = job.date_added || '';
  meta.appendChild(loc);
  meta.appendChild(date);
  card.appendChild(meta);

  let didDrag = false;
  card.addEventListener('dragstart', (e) => {
    didDrag = true;
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', card.dataset.key);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));
  card.addEventListener('click', () => {
    if (didDrag) {
      didDrag = false;
      return;
    }
    openModal(job);
  });

  return card;
}

// /api/jobs no longer ships job_summary -- it was two thirds of the payload and
// nothing on the board displays it. The modal is the only thing that wants it,
// and it already opens on click, so it fetches its own. Held on the job object
// afterwards: the edit box here is the only writer.
async function openModal(job) {
  const backdrop = document.getElementById('modalBackdrop');
  const panel = document.getElementById('modalPanel');
  panel.innerHTML = '';
  backdrop.classList.remove('hidden');

  // Always fetched, not only when the summary is missing: rounds have a second
  // writer -- inbox-triage on a daily cron -- so they are re-read every open and
  // never cached, while job_summary has one writer and is kept for the page.
  panel.textContent = 'Loading…';
  const haveSummary = typeof job.job_summary === 'string';
  try {
    const params = new URLSearchParams(jobKeyFields(job));
    if (haveSummary) params.set('summary', '0');
    const res = await fetch('/api/jobs/detail?' + params.toString());
    const data = await res.json();
    if (!haveSummary) job.job_summary = data.job_summary || '';
    job._rounds = data.interviews || [];
  } catch (err) {
    if (!haveSummary) job.job_summary = '';
    job._rounds = [];
  }
  if (backdrop.classList.contains('hidden')) return;  // closed while loading
  panel.innerHTML = '';

  panel.appendChild(buildModalContent(job));
  refreshMarkdownFields(panel);
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.add('hidden');
}

function buildModalContent(job) {
  const frag = document.createDocumentFragment();

  const head = document.createElement('div');
  head.className = 'modal-head';

  const titleBlock = document.createElement('div');
  const companyRow = document.createElement('div');
  companyRow.className = 'company-row';

  const companyEditable = document.createElement('h2');
  companyEditable.className = 'company-editable';
  companyEditable.contentEditable = 'true';
  companyEditable.textContent = job.company;
  companyEditable.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      companyEditable.blur();
    }
  });
  companyEditable.addEventListener('blur', () => {
    const value = companyEditable.textContent.trim();
    if (!value) {
      companyEditable.textContent = job.company;
      return;
    }
    if (value !== job.company) {
      saveField(job, 'company', value, companyEditable).then((ok) => {
        if (ok) {
          render();
          closeModal();
        }
      });
    }
  });
  companyRow.appendChild(companyEditable);

  if (job.link) {
    const a = document.createElement('a');
    a.className = 'company-link-icon';
    a.href = job.link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = '↗';
    a.title = job.link;
    companyRow.appendChild(a);
  }
  titleBlock.appendChild(companyRow);

  const subtitle = document.createElement('div');
  subtitle.className = 'modal-subtitle';
  subtitle.textContent = [job.position_title, job.location, job.date_added].filter(Boolean).join(' · ');
  titleBlock.appendChild(subtitle);
  head.appendChild(titleBlock);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.innerHTML = '&times;';
  closeBtn.addEventListener('click', closeModal);
  head.appendChild(closeBtn);

  frag.appendChild(head);

  frag.appendChild(buildModalStatusField(job));
  frag.appendChild(makeRecruiterField(job, () => render()));
  frag.appendChild(makeDetailField('Contacts', job, 'contacts'));
  frag.appendChild(makeDateField('Outreach Date', job, 'outreach_date'));
  frag.appendChild(makeDateField('Date Applied', job, 'date_applied'));
  frag.appendChild(makeFollowupField('Follow-up Log', job, 'followup_log'));
  frag.appendChild(makeMarkdownField('Job Description', job, 'job_summary'));
  frag.appendChild(makeMarkdownField('Notes', job, 'notes'));
  frag.appendChild(makeInterviewsField(job, job._rounds || []));
  frag.appendChild(makeDeleteField(job));

  return frag;
}

function buildModalStatusField(job) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-field';
  const label = document.createElement('label');
  label.textContent = 'Status';
  wrap.appendChild(label);

  const select = document.createElement('select');
  for (const s of STATUS_VALUES) {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s || '(none)';
    if (s === (job.status || '')) opt.selected = true;
    select.appendChild(opt);
  }
  select.addEventListener('change', () => {
    saveField(job, 'status', select.value, select).then(() => {
      render();
      const panel = document.getElementById('modalPanel');
      const dateInput = panel && panel.querySelector('input[data-field="date_applied"]');
      if (dateInput) dateInput.value = job.date_applied || '';
    });
  });
  wrap.appendChild(select);
  return wrap;
}

function addDropHandlers(body) {
  body.addEventListener('dragover', (e) => {
    e.preventDefault();
    body.classList.add('drag-over');
  });
  body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
  body.addEventListener('drop', async (e) => {
    e.preventDefault();
    body.classList.remove('drag-over');
    const key = e.dataTransfer.getData('text/plain');
    const job = allJobs.find(j => rowKey(j) === key);
    if (!job) return;
    const newStatus = body.dataset.status;
    if ((job.status || '') === newStatus) return;

    const res = await fetch('/api/jobs/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        company: job.company,
        date_added: job.date_added,
        position_title: job.position_title,
        link: job.link,
        field: 'status',
        value: newStatus,
      }),
    });
    if (res.ok) {
      job.status = newStatus;
      render();
    } else {
      alert('Failed to move card.');
    }
  });
}

function openAddJobModal() {
  const backdrop = document.getElementById('modalBackdrop');
  const panel = document.getElementById('modalPanel');
  panel.innerHTML = '';
  panel.appendChild(buildAddJobModalContent());
  backdrop.classList.remove('hidden');
  document.getElementById('addCompany').focus();
}

function buildAddJobModalContent() {
  const frag = document.createDocumentFragment();

  const head = document.createElement('div');
  head.className = 'modal-head';
  const h2 = document.createElement('h2');
  h2.textContent = 'Add Job';
  head.appendChild(h2);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.innerHTML = '&times;';
  closeBtn.addEventListener('click', closeModal);
  head.appendChild(closeBtn);
  frag.appendChild(head);

  const errorEl = document.createElement('div');
  errorEl.className = 'modal-error';
  errorEl.id = 'addJobError';
  frag.appendChild(errorEl);

  const urlWrap = document.createElement('div');
  urlWrap.className = 'modal-field';
  const urlLabel = document.createElement('label');
  urlLabel.textContent = 'Job URL';
  urlWrap.appendChild(urlLabel);
  const urlRow = document.createElement('div');
  urlRow.style.display = 'flex';
  urlRow.style.gap = '8px';
  const urlInput = document.createElement('input');
  urlInput.type = 'text';
  urlInput.id = 'fetchUrl';
  urlInput.placeholder = 'Paste a job posting URL...';
  urlRow.appendChild(urlInput);
  const fetchBtn = document.createElement('button');
  fetchBtn.className = 'linklike';
  fetchBtn.id = 'fetchUrlBtn';
  fetchBtn.textContent = 'Fetch';
  fetchBtn.addEventListener('click', fetchJobUrl);
  urlRow.appendChild(fetchBtn);
  urlWrap.appendChild(urlRow);
  frag.appendChild(urlWrap);

  const fields = [
    { id: 'addCompany', label: 'Company *' },
    { id: 'addTitle', label: 'Position Title *' },
    { id: 'addLocation', label: 'Location' },
    { id: 'addLink', label: 'Link' },
    { id: 'addContacts', label: 'Contacts' },
  ];
  for (const f of fields) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-field';
    const label = document.createElement('label');
    label.textContent = f.label;
    wrap.appendChild(label);
    const input = document.createElement('input');
    input.type = 'text';
    input.id = f.id;
    wrap.appendChild(input);
    frag.appendChild(wrap);
  }

  const statusWrap = document.createElement('div');
  statusWrap.className = 'modal-field';
  const statusLabel = document.createElement('label');
  statusLabel.textContent = 'Status';
  statusWrap.appendChild(statusLabel);
  const select = document.createElement('select');
  select.id = 'addStatus';
  for (const s of STATUS_VALUES) {
    if (!s) continue;
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    if (s === 'Tracking') opt.selected = true;
    select.appendChild(opt);
  }
  statusWrap.appendChild(select);
  frag.appendChild(statusWrap);

  for (const f of [{ id: 'addSummary', label: 'Job Summary' }, { id: 'addNotes', label: 'Notes' }]) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-field';
    const label = document.createElement('label');
    label.textContent = f.label;
    wrap.appendChild(label);
    const editable = document.createElement('div');
    editable.className = 'editable';
    editable.id = f.id;
    editable.contentEditable = 'true';
    wrap.appendChild(editable);
    frag.appendChild(wrap);
  }

  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'primary';
  submitBtn.textContent = 'Add Job';
  submitBtn.addEventListener('click', () => submitAddJob(submitBtn));
  actions.appendChild(submitBtn);
  frag.appendChild(actions);

  return frag;
}

async function fetchJobUrl() {
  const errorEl = document.getElementById('addJobError');
  errorEl.style.display = 'none';
  const url = document.getElementById('fetchUrl').value.trim();
  if (!url) return;

  const btn = document.getElementById('fetchUrlBtn');
  btn.disabled = true;
  btn.textContent = 'Fetching...';
  try {
    const res = await fetch('/api/jobs/fetch_url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Failed to fetch job posting.';
      errorEl.style.display = 'block';
      return;
    }
    document.getElementById('addCompany').value = data.company || '';
    document.getElementById('addTitle').value = data.position_title || '';
    document.getElementById('addLocation').value = data.location || '';
    document.getElementById('addLink').value = data.link || '';
    document.getElementById('addSummary').textContent = data.job_summary || '';
    document.getElementById('addNotes').textContent = data.notes || '';
  } catch (err) {
    errorEl.textContent = 'Failed to fetch job posting — check the server logs.';
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Fetch';
  }
}

async function submitAddJob(submitBtn) {
  const errorEl = document.getElementById('addJobError');
  errorEl.style.display = 'none';

  const company = document.getElementById('addCompany').value.trim();
  const position_title = document.getElementById('addTitle').value.trim();

  if (!company || !position_title) {
    errorEl.textContent = 'Company and Position Title are required.';
    errorEl.style.display = 'block';
    return;
  }

  const payload = {
    company,
    position_title,
    location: document.getElementById('addLocation').value.trim(),
    link: document.getElementById('addLink').value.trim(),
    status: document.getElementById('addStatus').value,
    contacts: document.getElementById('addContacts').value.trim(),
    job_summary: document.getElementById('addSummary').textContent.trim(),
    notes: document.getElementById('addNotes').textContent.trim(),
  };

  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/jobs/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Failed to add job.';
      errorEl.style.display = 'block';
      return;
    }
    allJobs.unshift(data);
    render();
    closeModal();
  } catch (err) {
    errorEl.textContent = 'Failed to add job — check the server logs.';
    errorEl.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
  }
}

document.getElementById('addJobBtn').addEventListener('click', openAddJobModal);
document.getElementById('exportCsvBtn').addEventListener('click', () => {
  window.location = '/api/jobs/export.csv';
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('dateFrom').addEventListener('change', render);
document.getElementById('dateTo').addEventListener('change', render);
document.getElementById('filterToday').addEventListener('click', () => {
  const today = localISODate(new Date());
  document.getElementById('dateFrom').value = today;
  document.getElementById('dateTo').value = today;
  render();
});
document.getElementById('filterWeek').addEventListener('click', () => {
  const today = new Date();
  document.getElementById('dateFrom').value = startOfWeekISO(today);
  document.getElementById('dateTo').value = localISODate(today);
  render();
});
document.getElementById('filterClearDates').addEventListener('click', () => {
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  render();
});

document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modalBackdrop') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

loadJobs();
</script>
