[pytest]
# Every test does `from src import ...`, and there is no packaging step. Without
# this, a bare `pytest -q` fails collection in 17 files with
# `ModuleNotFoundError: No module named 'src'`, and only `python3 -m pytest`
# works -- which put the repo's most common first-run failure in front of anyone
# following the README.
pythonpath = .
testpaths = tests
